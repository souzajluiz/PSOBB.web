# Compiles newserv once, on a GitHub runner, and publishes just what the
# runtime needs as ghcr.io/<owner>/psobb-newserv, so the server's deploy does
# not compile it (docs/DEPLOY.md, "Prebuilt newserv image"). Runs when the
# pinned refs in the Dockerfile change, or by hand.
name: newserv image

on:
  push:
    branches: [main]
    paths: ['Dockerfile', '.github/workflows/newserv-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: newserv-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # A private repository's runner has 2 cores and 7 GB (the 4-core / 16 GB
      # runner is for public repositories). The C++ compile of newserv and
      # resource_dasm starved it and the runner was lost, so: 2 jobs, plus swap.
      - name: Add swap
        run: |
          # The runner already uses /swapfile; add a bigger one on /mnt.
          df -h /mnt | tail -1
          sudo fallocate -l 10G /mnt/extra.swap
          sudo chmod 600 /mnt/extra.swap
          sudo mkswap /mnt/extra.swap
          sudo swapon /mnt/extra.swap
          free -h
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and tag
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # The tag is the three pinned refs, so a changed ref is a new tag.
          refs=$(grep -E '^ARG (PHOSG_REF|RESOURCE_DASM_REF|NEWSERV_REF)=' Dockerfile | sed 's/.*=//' | cut -c1-7 | paste -sd- -)
          echo "image=ghcr.io/${owner}/psobb-newserv" >> "$GITHUB_OUTPUT"
          echo "refs=${refs}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: newserv-artifacts
          platforms: linux/amd64
          build-args: BUILD_JOBS=2
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.refs }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
