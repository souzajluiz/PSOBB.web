<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <title>PSOBB.web Classic</title>
    <style>
      :root { color-scheme: dark; }
      /* touch-action: none: no pinch or double-tap zoom anywhere on the page
         (ui/nozoom.ts covers iOS Safari, which ignores this for pinch). */
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: none; }
      /* 100vh is the tall viewport on a phone (URL bar hidden), so it crops the
         bottom; 100dvh follows the bar. viewport.ts sets the exact box on touch
         screens (fullscreen, edge to edge); on a desktop window the stage fills it. */
      #stage { position: fixed; left: 0; top: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; outline: none; touch-action: none; }
      /* 3D view (ship select, lobby) under the 2D stage. */
      #world { position: fixed; left: 0; top: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; pointer-events: none; }
      #world[hidden] { display: none; }
      #rotate { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 12px); transform: translateX(-50%); z-index: 30; width: max-content; max-width: calc(100vw - 32px); padding: 8px 14px; border: 1px solid rgba(95, 212, 255, 0.55); border-radius: 999px; background: rgba(2, 16, 30, 0.85); color: #d8ecff; font: 600 13px/1.3 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
      #rotate[hidden] { display: none; }

      /* Loader: plain HTML/CSS, visible from the first paint until the title
         screen is drawn (classic/loader.ts updates it). Title colours: dark
         blue ground, cyan lettering; the status line pulses like the exe's
         "Connecting..". */
      #boot { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background: radial-gradient(ellipse at 50% 40%, #0b2a52 0%, #04142b 55%, #010612 100%); color: #9cd8f0; font: 14px Tahoma, Verdana, sans-serif; transition: opacity 0.45s ease; }
      #boot.is-done { opacity: 0; pointer-events: none; }
      #boot[hidden] { display: none; }
      .boot-card { width: min(360px, calc(100vw - 48px)); text-align: center; }
      .boot-psobb { display: block; font: 700 clamp(44px, 14vw, 72px)/1 Tahoma, Verdana, sans-serif; letter-spacing: 0.12em; text-indent: 0.12em; color: #5fd4ff; text-shadow: 0 0 18px rgba(95, 212, 255, 0.55), 0 2px 0 #0a3a6e, 0 4px 0 #062244; }
      .boot-sub { display: block; margin-top: 10px; font-size: 12px; letter-spacing: 0.32em; text-indent: 0.32em; color: #6fb4d8; }
      .boot-bb { display: block; margin-top: 2px; font-size: 11px; letter-spacing: 0.5em; text-indent: 0.5em; color: #3f86b0; }
      .boot-status { margin-top: 34px; min-height: 18px; font-size: 15px; font-weight: bold; color: #cfefff; }
      .boot-pulse { animation: boot-pulse 1.6s ease-in-out infinite; }
      @keyframes boot-pulse { 0%, 100% { opacity: 0.45; color: #5fd4ff; } 50% { opacity: 1; color: #ffffff; } }
      .boot-bar { position: relative; height: 8px; margin-top: 12px; overflow: hidden; border: 1px solid rgba(95, 212, 255, 0.55); border-radius: 2px; background: rgba(2, 16, 30, 0.7); }
      #boot-fill { height: 100%; width: 0; background: linear-gradient(90deg, #1b6fb5, #5fd4ff); box-shadow: 0 0 10px rgba(95, 212, 255, 0.7); transition: width 0.25s ease-out; }
      #boot.is-indeterminate #boot-fill { width: 30% !important; transition: none; animation: boot-slide 1.3s ease-in-out infinite; }
      @keyframes boot-slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
      #boot-detail { margin-top: 8px; min-height: 16px; font-size: 12px; color: #6fb4d8; }
      #boot-error, #boot-pick { margin-top: 22px; }
      #boot-error[hidden], #boot-pick[hidden] { display: none; }
      #boot-msg, #boot-pick p { margin: 0 0 14px; font-size: 13px; line-height: 1.45; color: #ffd0c0; word-break: break-word; }
      #boot-pick p { color: #cfefff; }
      #boot button { min-height: 44px; padding: 8px 22px; border: 1px solid #5fd4ff; border-radius: 4px; background: rgba(95, 212, 255, 0.16); color: #e8f8ff; font: bold 14px Tahoma, Verdana, sans-serif; cursor: pointer; touch-action: manipulation; }
      #boot button:active { background: rgba(95, 212, 255, 0.45); }
      #boot.is-error .boot-pulse { animation: none; opacity: 1; color: #ff9c85; }
      #boot.is-error .boot-bar, #boot.is-error #boot-detail { display: none; }
      @media (prefers-reduced-motion: reduce) { .boot-pulse, #boot.is-indeterminate #boot-fill { animation: none; } }
    </style>
  </head>
  <body>
    <canvas id="world" hidden aria-hidden="true"></canvas>
    <canvas id="stage" aria-label="PSOBB.web"></canvas>
    <div id="rotate" hidden>Rotate your phone for the best view</div>
    <div id="boot" class="is-indeterminate" role="status" aria-live="polite">
      <div class="boot-card">
        <span class="boot-psobb">PSOBB</span>
        <span class="boot-sub">PHANTASY STAR ONLINE</span>
        <span class="boot-bb">BLUE BURST</span>
        <div class="boot-status"><span id="boot-text" class="boot-pulse">Loading game data..</span></div>
        <div class="boot-bar"><div id="boot-fill"></div></div>
        <div id="boot-detail"></div>
        <div id="boot-pick" hidden>
          <p>Choose your PSOBB folder (the one with the data folder in it). The files stay on this device.</p>
          <button id="boot-pick-button" type="button">Open PSOBB folder</button>
        </div>
        <div id="boot-error" hidden>
          <p id="boot-msg"></p>
          <button id="boot-retry" type="button">Retry</button>
        </div>
      </div>
    </div>
    <script>
      // The module script failed to load or run before it could report.
      window.addEventListener('error', function (e) {
        var boot = document.getElementById('boot');
        if (!boot || boot.className.indexOf('is-done') >= 0 || boot.className.indexOf('is-error') >= 0) return;
        if (e.target && e.target.tagName === 'SCRIPT') {
          boot.className = 'is-error';
          document.getElementById('boot-text').textContent = 'The game could not start';
          document.getElementById('boot-msg').textContent = 'The game script failed to load.';
          document.getElementById('boot-error').hidden = false;
          document.getElementById('boot-retry').onclick = function () { location.reload(); };
        }
      }, true);
    </script>
    <script type="module" src="/src/classic/main.ts"></script>
  </body>
</html>
