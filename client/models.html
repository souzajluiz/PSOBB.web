<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>PSOBB.web Models</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0a1424; color: #cde; font: 13px system-ui, sans-serif; overflow: hidden; }
      #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
      #panel { position: fixed; top: 12px; left: 12px; padding: 10px 12px; background: #0008; border: 1px solid #345; border-radius: 6px; display: grid; grid-template-columns: auto auto; gap: 6px 10px; align-items: center; }
      #panel label { color: #9ab; }
      #panel input[type='number'] { width: 56px; }
      #status { position: fixed; left: 12px; bottom: 12px; color: #9ab; white-space: pre; }
      #status.err { color: #f88; }
    </style>
  </head>
  <body>
    <canvas id="view" aria-label="Player model"></canvas>
    <div id="panel">
      <label for="cls">Class</label><select id="cls"></select>
      <label for="section">Section ID</label><select id="section"></select>
      <label for="costume">Costume</label><input id="costume" type="number" min="0" value="0" />
      <label for="skin">Skin</label><input id="skin" type="number" min="0" value="0" />
      <label for="face">Face</label><input id="face" type="number" min="0" value="0" />
      <label for="head">Head</label><input id="head" type="number" min="0" value="0" />
      <label for="hair">Hair</label><input id="hair" type="number" min="0" value="0" />
      <label for="hair-color">Hair color</label><input id="hair-color" type="color" value="#a06e3c" />
      <label for="proportionX">Proportion X</label><input id="proportionX" type="range" min="0" max="0.99" step="0.01" value="0" />
      <label for="proportionY">Proportion Y</label><input id="proportionY" type="range" min="0" max="0.99" step="0.01" value="0" />
      <label for="rotate">Rotate</label><input id="rotate" type="checkbox" checked />
    </div>
    <div id="status">Loading...</div>
    <script type="module" src="/src/ui/modelsPage.ts"></script>
  </body>
</html>
